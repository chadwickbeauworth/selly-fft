[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selly-fft"
version = "0.1.0"
description = "Classical FFT-based associative memory search (Selly patent methodology, expired claims)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Tao Zero Human Company" },
]
keywords = ["fft", "associative-memory", "correlation", "dna", "sequence-matching", "patent", "prior-art"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-benchmark"]

[project.urls]
Homepage = "https://github.com/chadwickbeauworth/selly-fft"
"Bug Tracker" = "https://github.com/chadwickbeauworth/selly-fft/issues"

[tool.setuptools.packages.find]
where = ["src"]
